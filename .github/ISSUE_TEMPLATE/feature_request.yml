name: Feature request
description: Propose a concrete, reusable improvement to the starter package.
title: "[Feature]: "
labels: ["feature", "needs triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Explain who is affected and why the current package falls short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior or capability you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include workarounds or other approaches, if any.
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution interest
      options:
        - label: I am interested in helping implement this.
